## Staging overlay for AudioBlocks Backend (Issue #962 / OPS-02)
## Mirrors production topology and resource ceilings with complete parity.
##
## Staging connects to Stellar Testnet (soroban-testnet.stellar.org) and isolated
## staging backing services (PostgreSQL, Redis, RabbitMQ, S3 bucket).
## NODE_ENV is strictly 'production' to enforce identical TypeORM migration behavior
## (schema synchronization disabled).

version: '3.9'
services:
  backend:
    command: sh -c "npm start"
    environment:
      NODE_ENV: production
      # Staging CORS allowlist for testnet frontend and internal QA
      # ALLOWED_ORIGINS=https://staging.audioblocks.io,https://staging-artist.audioblocks.io
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    depends_on:
      - db
      - redis
      - rabbitmq
  db:
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
  redis:
    command: redis-server --maxmemory 200mb --maxmemory-policy volatile-lru
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
  rabbitmq:
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
