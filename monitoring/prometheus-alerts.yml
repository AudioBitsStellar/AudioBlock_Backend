# Prometheus alerting rules for the AudioBlock indexer (Issue #240).
#
# The indexer exposes `indexer_lag_ledgers` — the difference between the
# current Stellar ledger tip and the last ledger the worker indexed, per
# network/contract. These rules fire when that lag is sustained past a
# threshold, indicating the worker has stalled (RPC outage, crash loop, etc.).
#
# Runbook: https://github.com/AudioBitsStellar/AudioBlock_Backend/blob/main/docs/indexer-backfill-runbook.md
groups:
  - name: audioblock-indexer
    rules:
      # Fires when any contract has been lagging behind the tip for 15+ minutes.
      # Threshold (INDEXER_LAG_ALERT_THRESHOLD_LEDGERS) defaults to 1000 ledgers.
      - alert: HighIndexerLag
        expr: |
          indexer_lag_ledgers > 1000
        for: 15m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Indexer is lagging for {{ $labels.contract }} on {{ $labels.network }}"
          description: >
            The indexer worker has been {{ $value }} ledgers behind the current
            tip for {{ $labels.contract }} on {{ $labels.network }} for over 15
            minutes. The worker may have stalled (RPC outage or crash loop).
          runbook: "https://github.com/AudioBitsStellar/AudioBlock_Backend/blob/main/docs/indexer-backfill-runbook.md"
          dashboard: "http://localhost:3001/d/audioblock-indexer"

      # Escalates a critical warning if a contract falls far behind the tip.
      - alert: CriticalIndexerLag
        expr: |
          indexer_lag_ledgers > 10000
        for: 30m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Indexer critically behind for {{ $labels.contract }} on {{ $labels.network }}"
          description: >
            {{ $labels.contract }} on {{ $labels.network }} is {{ $value }} ledgers
            behind the tip and needs immediate attention.
          runbook: "https://github.com/AudioBitsStellar/AudioBlock_Backend/blob/main/docs/indexer-backfill-runbook.md"
          dashboard: "http://localhost:3001/d/audioblock-indexer"
