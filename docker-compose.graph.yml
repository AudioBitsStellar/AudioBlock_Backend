# docker-compose.graph.yml
#
# Issue #659: Set up local Graph Node for development via Docker
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.graph.yml up --profile graph
#
# This overlay adds three services to the base stack:
#   - ipfs         : A local IPFS node used by graph-node to store subgraph data
#   - graph-db     : A dedicated PostgreSQL instance for graph-node (separate from
#                    the application DB so the two can be wiped independently)
#   - graph-node   : The Graph Node connected to the Stellar/Soroban testnet RPC
#
# Environment variables:
#   ETHEREUM_RPC   The Stellar/Soroban RPC endpoint used by graph-node to poll
#                  for new events. Defaults to the public Soroban testnet endpoint.
#   START_BLOCK    Ledger / block number from which graph-node begins indexing.
#                  Defaults to 0 (genesis), set to the AudioBlock contract deployment
#                  ledger to skip historical data during development.
#
# After the stack is running, deploy your subgraph with:
#   cd subgraph && npm run codegen && npm run build
#   npx graph create --node http://localhost:8020/ audioblock/local
#   npx graph deploy --node http://localhost:8020/ --ipfs http://localhost:5001/ \
#       audioblock/local

services:
  # ---- IPFS ----------------------------------------------------------------
  ipfs:
    image: ipfs/kubo:v0.27.0
    container_name: audioblock-graph-ipfs
    profiles:
      - graph
    ports:
      - "5001:5001"   # API
      - "8080:8080"   # Gateway
    volumes:
      - graph_ipfs_data:/data/ipfs
    healthcheck:
      test: ["CMD-SHELL", "ipfs dag stat /ipfs/QmUNLLsPACCz1vLxQVkXqqLX5R1X345qqfHbsf67hvA3Nn 2>/dev/null || exit 0"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ---- Dedicated PostgreSQL for graph-node ---------------------------------
  graph-db:
    image: postgres:15-alpine
    container_name: audioblock-graph-db
    profiles:
      - graph
    environment:
      POSTGRES_USER: graph-node
      POSTGRES_PASSWORD: let-me-in
      POSTGRES_DB: graph-node
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    ports:
      - "5433:5432"   # Exposed on 5433 to avoid conflict with the app DB on 5432
    volumes:
      - graph_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graph-node"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---- The Graph Node ------------------------------------------------------
  graph-node:
    image: graphprotocol/graph-node:v0.35.1
    container_name: audioblock-graph-node
    profiles:
      - graph
    depends_on:
      graph-db:
        condition: service_healthy
      ipfs:
        condition: service_healthy
    ports:
      - "8000:8000"   # GraphQL HTTP
      - "8001:8001"   # GraphQL WebSocket
      - "8020:8020"   # JSON-RPC admin (used by `graph deploy`)
      - "8030:8030"   # Subgraph indexing status API
      - "8040:8040"   # Prometheus metrics
    environment:
      postgres_host: graph-db
      postgres_user: graph-node
      postgres_pass: let-me-in
      postgres_db: graph-node
      ipfs: "ipfs:5001"
      # Soroban testnet RPC (override via ETHEREUM_RPC env var to use a private node)
      ethereum: "stellar:${ETHEREUM_RPC:-https://soroban-testnet.stellar.org}"
      GRAPH_LOG: info
      GRAPH_NODE_ID: default
      GRAPH_ALLOW_NON_DETERMINISTIC_IPFS: "true"
      ETHEREUM_REORG_THRESHOLD: "1"
      ETHEREUM_ANCESTOR_COUNT: "1"
    volumes:
      - graph_node_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8030/health 2>/dev/null | grep -q 'healthy' || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5

volumes:
  graph_ipfs_data:
  graph_pg_data:
  graph_node_data:
