name: Terraform Plan / Apply

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
  push:
    branches: [main]
    paths:
      - 'infra/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to apply'
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      action:
        description: 'Terraform action'
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan

permissions:
  contents: read
  pull-requests: write
  id-token: write   # required for OIDC AWS credential federation

concurrency:
  group: terraform-${{ github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  # ── Detect which environments changed ────────────────────────────────────────
  detect-changes:
    name: Detect changed environments
    runs-on: ubuntu-latest
    outputs:
      staging:    ${{ steps.filter.outputs.staging }}
      production: ${{ steps.filter.outputs.production }}
    steps:
      - uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            staging:
              - 'infra/environments/staging/**'
              - 'infra/modules/**'
            production:
              - 'infra/environments/production/**'
              - 'infra/modules/**'

  # ── Validate HCL formatting ───────────────────────────────────────────────────
  fmt-check:
    name: Terraform fmt check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      - name: Check formatting
        run: terraform fmt -check -recursive infra/

  # ── Validate module syntax ────────────────────────────────────────────────────
  validate:
    name: Terraform validate (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    defaults:
      run:
        working-directory: infra/environments/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      - name: Terraform init (local backend for validation only)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  # ── Plan staging ──────────────────────────────────────────────────────────────
  plan-staging:
    name: Plan — staging
    runs-on: ubuntu-latest
    needs: [detect-changes, fmt-check, validate]
    if: |
      needs.detect-changes.outputs.staging == 'true' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment: staging
    defaults:
      run:
        working-directory: infra/environments/staging
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN_STAGING }}
          aws-region: us-east-1

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        id: plan
        run: |
          terraform plan \
            -var="ecr_image_uri=ghcr.io/${{ github.repository }}" \
            -var="image_tag=staging-latest" \
            -var="acm_certificate_arn=${{ secrets.ACM_CERT_ARN_STAGING }}" \
            -out=tfplan.binary 2>&1 | tee plan.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Convert plan to readable output
        run: terraform show -no-color tfplan.binary > plan-readable.txt

      - name: Post plan as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/environments/staging/plan-readable.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(0, 60000) + '\n\n...[truncated]' : plan;
            const body = `## Terraform Plan — staging\n\`\`\`hcl\n${truncated}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-staging-${{ github.sha }}
          path: infra/environments/staging/tfplan.binary
          retention-days: 7

  # ── Plan production ───────────────────────────────────────────────────────────
  plan-production:
    name: Plan — production
    runs-on: ubuntu-latest
    needs: [detect-changes, fmt-check, validate]
    if: |
      needs.detect-changes.outputs.production == 'true' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment: production
    defaults:
      run:
        working-directory: infra/environments/production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN_PROD }}
          aws-region: us-east-1

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        id: plan
        run: |
          terraform plan \
            -var="ecr_image_uri=ghcr.io/${{ github.repository }}" \
            -var="image_tag=production-latest" \
            -var="acm_certificate_arn=${{ secrets.ACM_CERT_ARN_PROD }}" \
            -var="kms_key_arn=${{ secrets.KMS_KEY_ARN_PROD }}" \
            -var="replica_bucket_arn=${{ secrets.S3_REPLICA_BUCKET_ARN_PROD }}" \
            -out=tfplan.binary 2>&1 | tee plan.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Convert plan to readable output
        run: terraform show -no-color tfplan.binary > plan-readable.txt

      - name: Post plan as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/environments/production/plan-readable.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(0, 60000) + '\n\n...[truncated]' : plan;
            const body = `## Terraform Plan — production\n\`\`\`hcl\n${truncated}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-production-${{ github.sha }}
          path: infra/environments/production/tfplan.binary
          retention-days: 7

  # ── Apply staging (main branch only, requires manual approval) ───────────────
  apply-staging:
    name: Apply — staging
    runs-on: ubuntu-latest
    needs: plan-staging
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply' && github.event.inputs.environment == 'staging'))
    environment:
      name: staging
      url: https://staging-api.audioblocks.io
    defaults:
      run:
        working-directory: infra/environments/staging
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN_STAGING }}
          aws-region: us-east-1

      - name: Terraform init
        run: terraform init

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-staging-${{ github.sha }}
          path: infra/environments/staging/

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan.binary

  # ── Apply production (main branch + semver tag, requires manual approval) ────
  apply-production:
    name: Apply — production
    runs-on: ubuntu-latest
    needs: plan-production
    if: |
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply' && github.event.inputs.environment == 'production')
    environment:
      name: production
      url: https://api.audioblocks.io
    defaults:
      run:
        working-directory: infra/environments/production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN_PROD }}
          aws-region: us-east-1

      - name: Terraform init
        run: terraform init

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-production-${{ github.sha }}
          path: infra/environments/production/

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan.binary
