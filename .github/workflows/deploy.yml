name: CD - Build and Deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production
        default: 'staging'
      image_tag:
        description: 'Optional image tag override (defaults to commit SHA or release tag)'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Validate build and configuration without shifting live traffic'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: deploy-${{ github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_digest: ${{ steps.build.outputs.digest }}
      target_env: ${{ steps.determine-env.outputs.target_env }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Determine Target Environment
        id: determine-env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target_env=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/v[0-9]+ ]]; then
            echo "target_env=production" >> "$GITHUB_OUTPUT"
          else
            echo "target_env=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=staging-latest,enable=${{ steps.determine-env.outputs.target_env == 'staging' }}
            type=raw,value=production-latest,enable=${{ steps.determine-env.outputs.target_env == 'production' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging (Testnet)
    needs: build-and-push
    if: needs.build-and-push.outputs.target_env == 'staging'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging-api.audioblocks.io
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Make deploy verification script executable
        run: chmod +x scripts/deploy-verify-rollback.sh

      - name: Validate Staging Environment Consistency
        run: |
          echo "Verifying staging environment configuration..."
          node scripts/check-env-example.js --strict

      - name: Deploy Staging Workload (Rolling Update)
        env:
          IMAGE_URI: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          echo "Deploying image $IMAGE_URI to Staging environment..."
          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY_RUN enabled: Skipping remote container orchestration update."
            exit 0
          fi
          # In AWS ECS / Container platform:
          # aws ecs update-service --cluster audioblocks-staging --service api --force-new-deployment

      - name: Verify Health and Automated Rollback
        if: ${{ !(inputs.dry_run) }}
        env:
          TARGET_URL: ${{ vars.STAGING_API_URL || 'https://staging-api.audioblocks.io' }}
          TIMEOUT_SECONDS: 120
          INTERVAL_SECONDS: 5
        run: |
          ./scripts/deploy-verify-rollback.sh \
            --url "$TARGET_URL" \
            --timeout "$TIMEOUT_SECONDS" \
            --interval "$INTERVAL_SECONDS" \
            --environment "staging"

  deploy-production:
    name: Deploy to Production (Mainnet)
    needs: build-and-push
    if: needs.build-and-push.outputs.target_env == 'production'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.audioblocks.io
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Make deploy verification script executable
        run: chmod +x scripts/deploy-verify-rollback.sh

      - name: Validate Production Pre-flight Configuration
        run: |
          echo "Verifying production environment configuration..."
          node scripts/check-env-example.js --strict

      - name: Deploy Production Workload (Zero-Downtime Rolling Update)
        env:
          IMAGE_URI: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          echo "Deploying image $IMAGE_URI to Production environment..."
          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY_RUN enabled: Skipping live production traffic switch."
            exit 0
          fi
          # Minimum healthy percent: 100%, Maximum percent: 200%
          # aws ecs update-service --cluster audioblocks-prod --service api --force-new-deployment

      - name: Verify Production Health and Automated Rollback
        if: ${{ !(inputs.dry_run) }}
        env:
          TARGET_URL: ${{ vars.PRODUCTION_API_URL || 'https://api.audioblocks.io' }}
          TIMEOUT_SECONDS: 180
          INTERVAL_SECONDS: 5
        run: |
          ./scripts/deploy-verify-rollback.sh \
            --url "$TARGET_URL" \
            --timeout "$TIMEOUT_SECONDS" \
            --interval "$INTERVAL_SECONDS" \
            --environment "production"
