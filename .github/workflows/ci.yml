name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  case-collision-check:
    name: Reject case-colliding paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for case-insensitive path collisions
        run: |
          collisions=$(git ls-files | sort -f | uniq -di)
          if [ -n "$collisions" ]; then
            echo "Case-colliding paths detected (breaks macOS/Windows clones):"
            echo "$collisions"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint

  test:
    name: Unit & Integration tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci
      - name: Run tests with --detectOpenHandles
        run: npm test -- --detectOpenHandles

  audit:
    name: Dependency vulnerability gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: npm audit (fail on high/critical)
        run: npm audit --audit-level=high
      - name: Validate docker-compose consistency (Issue #404)
        run: node scripts/check-compose-consistency.js
      - name: Validate .env.example vs required env (Issue # env-sync)
        run: node scripts/check-env-example.js
      - name: Check OpenAPI spec for route drift (Issue #338)
        run: node scripts/check-openapi-drift.js
      - name: Ensure tests never need a live AI provider key (Issue #287)
        run: node scripts/check-ai-test-isolation.js

  migration-check:
    name: Migration schema drift check (#926)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: audioblocks
          POSTGRES_PASSWORD: audioblocks
          POSTGRES_DB: audioblocks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Run all migrations against empty Postgres
        env:
          DATABASE_URL: postgres://audioblocks:audioblocks@localhost:5432/audioblocks_test
          NODE_ENV: test
        run: npx typeorm migration:run -d src/config/db.ts
      - name: Check for schema drift (synchronize must produce no changes)
        env:
          DATABASE_URL: postgres://audioblocks:audioblocks@localhost:5432/audioblocks_test
          NODE_ENV: test
        run: node scripts/check-schema-drift.js

  deadcode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Check for dead code
        run: npm run deadcode:production

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-scan:
    runs-on: ubuntu-latest
    needs: [lint, deadcode]
    permissions:
      contents: read
      security-events: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t audioblock-backend .

      - name: Scan base image (node:20)
        id: scan-base
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: node:20
          format: sarif
          output: trivy-base-results.sarif
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Scan final image
        id: scan-final
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: audioblock-backend
          format: sarif
          output: trivy-final-results.sarif
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Upload SARIF results (base)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-base-results.sarif
          category: trivy-base

      - name: Upload SARIF results (final)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-final-results.sarif
          category: trivy-final

      - name: Archive scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results-${{ github.sha }}
          path: |
            trivy-base-results.sarif
            trivy-final-results.sarif
          retention-days: 90

      - name: Block merge on critical/high findings
        if: (github.event_name == 'push' || github.event_name == 'pull_request') && (steps.scan-base.outcome == 'failure' || steps.scan-final.outcome == 'failure')
        run: exit 1

  e2e:
    name: E2E pipeline tests (nightly, #935)
    runs-on: ubuntu-latest
    # Run nightly via schedule and on manual dispatch; skip on regular PRs to
    # keep the fast-feedback loop quick.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    services:
      db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: audioblocks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/audioblocks_test
        run: npm run db:migrate 2>/dev/null || npx knex migrate:latest 2>/dev/null || true

      - name: Start backend in background
        env:
          NODE_ENV: test
          PORT: 4000
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/audioblocks_test
          REDIS_URL: redis://localhost:6379
          RABBITMQ_URL: amqp://localhost:5672
          JWT_SECRET: e2e-test-secret-not-for-production
        run: npm run start &
        # Give the server a few seconds to bind before the test suite starts.

      - name: Run E2E pipeline tests
        env:
          E2E_BASE_URL: http://localhost:4000
          E2E_TIMEOUT_MS: "90000"
        run: npx jest --testPathPattern="tests/e2e" --forceExit --detectOpenHandles
