name: Subgraph - Auto Deploy on Merge to Main

on:
  push:
    branches: [main]
    paths:
      - 'subgraph/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'testnet'
        type: choice
        options:
          - testnet
          - mainnet

jobs:
  deploy-testnet:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: ./subgraph
    environment:
      name: subgraph-testnet

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: subgraph/package.json

      - name: Install dependencies
        run: npm install

      - name: Validate schema and manifest
        run: |
          [ -f schema.graphql ] || (echo "Error: schema.graphql not found" && exit 1)
          [ -f subgraph.yaml ] || (echo "Error: subgraph.yaml not found" && exit 1)
          echo "Validation passed"

      - name: Generate types
        run: npm run codegen
        continue-on-error: true

      - name: Build subgraph
        run: npm run build

      - name: Deploy to testnet
        run: npm run deploy:testnet
        env:
          GRAPH_DEPLOY_TOKEN_TESTNET: ${{ secrets.GRAPH_DEPLOY_TOKEN_TESTNET || secrets.GRAPH_DEPLOY_TOKEN }}

      - name: Notify deployment
        if: success()
        run: |
          echo "Subgraph deployed to testnet successfully"
          echo "Subgraph: AudioBitsStellar/audioblock-testnet"

      - name: Report deployment failure
        if: failure()
        run: |
          echo "## Subgraph Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "Testnet deployment failed. Check the workflow logs for details." >> $GITHUB_STEP_SUMMARY

  deploy-manual:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: ./subgraph

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: subgraph/package.json

      - name: Install dependencies
        run: npm install

      - name: Build subgraph
        run: npm run build

      - name: Deploy based on environment
        run: |
          echo "Deploying to ${{ github.event.inputs.environment }}"
          if [ "${{ github.event.inputs.environment }}" = "testnet" ]; then
            npm run deploy:testnet
          elif [ "${{ github.event.inputs.environment }}" = "mainnet" ]; then
            npm run deploy:mainnet
          fi
        env:
          GRAPH_DEPLOY_TOKEN_TESTNET: ${{ secrets.GRAPH_DEPLOY_TOKEN_TESTNET || secrets.GRAPH_DEPLOY_TOKEN }}
          GRAPH_DEPLOY_TOKEN_MAINNET: ${{ secrets.GRAPH_DEPLOY_TOKEN_MAINNET || secrets.GRAPH_DEPLOY_TOKEN }}

      - name: Create workflow summary
        run: |
          echo "## Subgraph Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_STEP_SUMMARY
          echo "- Status: Completed" >> $GITHUB_STEP_SUMMARY
