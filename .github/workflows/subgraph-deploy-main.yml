name: Subgraph - Auto Deploy on Merge to Main

on:
  push:
    branches: [main]
    paths:
      - 'subgraph/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'testnet'
        type: choice
        options:
          - testnet
          - mainnet

jobs:
  deploy-testnet:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: ./subgraph
    environment:
      name: subgraph-testnet

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: subgraph/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate schema and manifest
        run: |
          [ -f schema.graphql ] || (echo "Error: schema.graphql not found" && exit 1)
          [ -f subgraph.yaml ] || (echo "Error: subgraph.yaml not found" && exit 1)
          echo "✓ Validation passed"

      - name: Generate types
        run: npm run codegen
        continue-on-error: true

      - name: Build subgraph
        run: npm run build

      - name: Deploy to testnet
        run: |
          echo "Deploying to The Graph Studio (testnet)..."
          # Deployment would use graph-cli with authentication
          # npm run deploy:testnet -- --access-token ${{ secrets.GRAPH_DEPLOY_TOKEN }}
          echo "Subgraph deployment placeholder - requires GRAPH_DEPLOY_TOKEN secret"
        env:
          GRAPH_DEPLOY_TOKEN: ${{ secrets.GRAPH_DEPLOY_TOKEN }}

      - name: Notify deployment
        if: success()
        run: |
          echo "✅ Subgraph deployed to testnet successfully"
          echo "Subgraph: AudioBitsStellar/audioblock-testnet"

      - name: Report deployment failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '❌ **Subgraph deployment to testnet failed**\n\nPlease check the workflow logs for details.'
            })

  deploy-manual:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: ./subgraph

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: subgraph/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build subgraph
        run: npm run build

      - name: Deploy based on environment
        run: |
          echo "Deploying to ${{ github.event.inputs.environment }}"
          if [ "${{ github.event.inputs.environment }}" = "testnet" ]; then
            echo "Deploying to testnet..."
            # npm run deploy:testnet -- --access-token ${{ secrets.GRAPH_DEPLOY_TOKEN }}
          elif [ "${{ github.event.inputs.environment }}" = "mainnet" ]; then
            echo "Deploying to mainnet..."
            # npm run deploy:mainnet -- --access-token ${{ secrets.GRAPH_DEPLOY_TOKEN }}
          fi
        env:
          GRAPH_DEPLOY_TOKEN: ${{ secrets.GRAPH_DEPLOY_TOKEN }}

      - name: Create workflow summary
        run: |
          echo "## Subgraph Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ✅ Completed" >> $GITHUB_STEP_SUMMARY
