version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "09:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: " Dependabot"
    ignore:
      - dependency-name: "*"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "09:00"
    open-pull-requests-limit: 10
    commit-message:
      prefix: " Dependabot"
    branches:
      - main
    ignore:
      - dependency-name: "lodash"
      - dependency-name: "moment"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "09:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: " Dependabot"
    branches:
      - main