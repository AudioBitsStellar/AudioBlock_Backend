name: Bug Report
description: Report a reproducible bug in AudioBlock Backend
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Fill out the sections below so we can reproduce and fix it quickly.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: What went wrong?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps to reproduce the behaviour.
      placeholder: |
        1. Call endpoint POST /api/auth/login with ...
        2. Observe response ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened. Include error messages, stack traces, or response bodies.
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local (Docker)
        - Local (bare metal)
        - Staging
        - Production
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: 'e.g. 20.11.0'

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: 'e.g. Ubuntu 22.04 / macOS 14'

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / logs
      description: Attach any relevant screenshots, curl commands, or log output.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Any other context that may help diagnose the issue.
