name: Feature Request
description: Propose a new feature or enhancement for AudioBlock Backend
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Use this template to propose new functionality. The more context you provide, the faster we can evaluate and implement it.

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this feature solve? Link related issues or user pain points.
      placeholder: As a … I want … so that …
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the solution you'd like, including API changes, new endpoints, or data model changes.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternative approaches you evaluated and why you ruled them out.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      multiple: true
      options:
        - Authentication / Auth
        - Artist profiles
        - Song / Upload
        - Marketplace / NFT
        - Wallet / Stellar
        - Background jobs
        - Admin
        - Observability / Metrics
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: breaking
    attributes:
      label: Is this a breaking change?
      options:
        - 'No'
        - 'Yes — describe in additional context'
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Mockups, diagrams, related PRs, or any other context.
