openapi: 3.0.3
info:
  title: AudioBlocks Backend API Reference
  version: 1.0.0
  description: API reference for AudioBlocks music NFT platform on Stellar/Soroban.
paths:
  /api/api-keys:
    post:
      summary: Create an API key
      description: Issues a new API key with explicit scopes (read-only, upload, admin).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                scopes:
                  type: array
                  items:
                    type: string
                    enum: [read-only, upload, admin]
      responses:
        '201':
          description: API key created successfully.
    get:
      summary: List API keys
      description: Returns the list of API keys for the authenticated user.
  /api/api-keys/{id}:
    delete:
      summary: Revoke an API key
      description: Revokes an active API key.

  /api/activity/onchain:
    get:
      summary: List indexed on-chain activity
      description: Queries indexed on-chain events from Soroban contracts with pagination and filtering by contractType, eventType, and address.
      parameters:
        - name: contractType
          in: query
          required: false
          description: Filter events by smart contract type (e.g. nft, artist, catalog, royalty, marketplace).
          schema:
            type: string
        - name: eventType
          in: query
          required: false
          description: Filter events by event name/type (e.g. mint, transfer, royalty_payout, sale, list, setup).
          schema:
            type: string
        - name: address
          in: query
          required: false
          description: Filter events by wallet or contract address (e.g. Stellar public key).
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: 1-based page number for pagination.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Number of items per page (maximum 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: A paginated list of indexed on-chain events.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/IndexedEvent'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
components:
  schemas:
    IndexedEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        contractType:
          type: string
          nullable: true
          example: marketplace
        contractId:
          type: string
          nullable: true
          example: CA...
        eventType:
          type: string
          example: sale
        address:
          type: string
          nullable: true
          example: GBXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
        txHash:
          type: string
          nullable: true
          example: a1b2c3d4e5f6...
        ledger:
          type: integer
          nullable: true
          example: 123456
        data:
          type: object
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 42
        totalPages:
          type: integer
          example: 3
