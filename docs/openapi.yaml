openapi: 3.0.3
info:
  title: AudioBlock Backend API
  description: |
    REST API for the AudioBlock music NFT platform. Handles authentication,
    artist profiles, song uploads, Stellar/Soroban on-chain interactions,
    marketplace listings, and admin moderation.
  version: 1.0.0
  contact:
    name: AudioBitsStellar
    url: https://github.com/AudioBitsStellar/AudioBlock_Backend

servers:
  - url: http://localhost:4000
    description: Local development
  - url: https://api.audioblockz.com
    description: Production

tags:
  - name: Auth
    description: Authentication and session management
  - name: Artist
    description: Artist profile and on-chain setup
  - name: Song
    description: Song upload, streaming, and on-chain minting
  - name: Marketplace
    description: NFT listing and purchase (Soroban relay)
  - name: Wallet
    description: EVM wallet utilities (Dynamic Labs)
  - name: Admin
    description: Admin moderation and job management
  - name: Health
    description: Service health checks

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by POST /api/auth/login or /api/auth/login-email

  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          example: Unauthorized
        message:
          type: string
          example: Invalid or expired token

    UserTokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        user:
          type: object
          properties:
            id:
              type: string
            email:
              type: string
            role:
              type: string
              enum: [artist, listener, admin]

    SignedXdrBody:
      type: object
      required: [signedXdr]
      properties:
        signedXdr:
          type: string
          description: Base64-encoded signed Stellar transaction XDR

    JobStatus:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

paths:
  # ── Auth ──────────────────────────────────────────────────────────────────

  /api/auth/nonce/{email}:
    get:
      tags: [Auth]
      summary: Get wallet login nonce
      description: Returns a one-time nonce that the client must sign with their wallet private key to authenticate.
      parameters:
        - name: email
          in: path
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Nonce issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  nonce:
                    type: string
        '429':
          description: Rate limit exceeded

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register artist via wallet signature
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, walletAddress, signature]
              properties:
                email:
                  type: string
                  format: email
                walletAddress:
                  type: string
                signature:
                  type: string
      responses:
        '201':
          description: Artist registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTokenResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded

  /api/auth/register-listener:
    post:
      tags: [Auth]
      summary: Register listener via wallet signature
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, walletAddress, signature]
              properties:
                email:
                  type: string
                  format: email
                walletAddress:
                  type: string
                signature:
                  type: string
      responses:
        '201':
          description: Listener registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTokenResponse'
        '400':
          $ref: '#/components/schemas/Error'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login via wallet signature
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, signature]
              properties:
                email:
                  type: string
                  format: email
                signature:
                  type: string
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTokenResponse'
        '401':
          description: Invalid signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/register-email:
    post:
      tags: [Auth]
      summary: Register with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, role]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  minLength: 8
                role:
                  type: string
                  enum: [artist, listener]
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTokenResponse'

  /api/auth/login-email:
    post:
      tags: [Auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTokenResponse'
        '401':
          description: Invalid credentials

  /api/auth/2fa/enable:
    post:
      tags: [Auth]
      summary: Enable TOTP two-factor authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 2FA setup initiated; returns QR code URI
          content:
            application/json:
              schema:
                type: object
                properties:
                  otpAuthUrl:
                    type: string
                  secret:
                    type: string

  /api/auth/verify-email/{token}:
    get:
      tags: [Auth]
      summary: Verify email address
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Email verified
        '400':
          description: Invalid or expired token

  /api/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset email sent (always 200 to prevent enumeration)

  /api/auth/reset-password/{token}:
    post:
      tags: [Auth]
      summary: Reset password using token from email
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  format: password
                  minLength: 8
      responses:
        '200':
          description: Password reset successfully
        '400':
          description: Invalid or expired token

  # ── Artist ────────────────────────────────────────────────────────────────

  /api/artist/update-profile:
    patch:
      tags: [Artist]
      summary: Update artist profile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                bio:
                  type: string
                profileImage:
                  type: string
                  format: binary
                pageCover:
                  type: string
                  format: binary
      responses:
        '200':
          description: Profile updated
        '401':
          description: Unauthorized

  /api/artist/onchain/connect-wallet:
    post:
      tags: [Artist]
      summary: Prepare on-chain wallet connection transaction
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stellarPublicKey]
              properties:
                stellarPublicKey:
                  type: string
      responses:
        '200':
          description: Unsigned XDR returned for client signing
          content:
            application/json:
              schema:
                type: object
                properties:
                  unsignedXdr:
                    type: string

  # ── Song ──────────────────────────────────────────────────────────────────

  /api/song/upload/chunk:
    post:
      tags: [Song]
      summary: Upload a single audio chunk
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [fileId, chunkIndex, totalChunks, chunk]
              properties:
                fileId:
                  type: string
                chunkIndex:
                  type: integer
                totalChunks:
                  type: integer
                chunk:
                  type: string
                  format: binary
      responses:
        '200':
          description: Chunk received
        '400':
          description: Invalid chunk parameters
        '413':
          description: Chunk exceeds size limit

  /api/song/upload/finalize:
    post:
      tags: [Song]
      summary: Finalize chunked upload and trigger processing
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileId, title]
              properties:
                fileId:
                  type: string
                title:
                  type: string
                genreId:
                  type: string
      responses:
        '202':
          description: Upload finalised; processing queued

  /api/song/upload/cover:
    post:
      tags: [Song]
      summary: Upload cover art for a song
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [songId, cover]
              properties:
                songId:
                  type: string
                cover:
                  type: string
                  format: binary
      responses:
        '200':
          description: Cover uploaded

  /api/song/stream/{id}:
    get:
      tags: [Song]
      summary: Stream audio file
      description: Returns audio data with HTTP Range support for seeking.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: Range
          in: header
          schema:
            type: string
            example: 'bytes=0-'
      responses:
        '200':
          description: Full audio response
        '206':
          description: Partial content (Range request)
        '404':
          description: Song not found

  /api/song/search:
    get:
      tags: [Song]
      summary: Search songs
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: genre
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Search results

  /api/song/{id}/onchain/prepare-mint:
    post:
      tags: [Song]
      summary: Prepare NFT mint transaction
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Unsigned mint XDR

  /api/song/{id}/onchain/submit-mint:
    post:
      tags: [Song]
      summary: Submit signed mint transaction
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignedXdrBody'
      responses:
        '200':
          description: Mint submitted to Horizon

  # ── Marketplace ───────────────────────────────────────────────────────────

  /api/marketplace/prepare-listing:
    post:
      tags: [Marketplace]
      summary: Prepare NFT listing transaction
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [songId, priceXlm]
              properties:
                songId:
                  type: string
                priceXlm:
                  type: number
      responses:
        '200':
          description: Unsigned listing XDR

  /api/marketplace/submit-listing:
    post:
      tags: [Marketplace]
      summary: Submit signed listing transaction
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignedXdrBody'
      responses:
        '200':
          description: Listing submitted

  /api/marketplace/prepare-buy:
    post:
      tags: [Marketplace]
      summary: Prepare NFT purchase transaction
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listingId]
              properties:
                listingId:
                  type: string
      responses:
        '200':
          description: Unsigned purchase XDR

  /api/marketplace/submit-buy:
    post:
      tags: [Marketplace]
      summary: Submit signed purchase transaction
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignedXdrBody'
      responses:
        '200':
          description: Purchase submitted

  # ── Wallet ────────────────────────────────────────────────────────────────

  /api/wallet/evm/create:
    post:
      tags: [Wallet]
      summary: Create an embedded EVM wallet (Dynamic Labs)
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Wallet created
          content:
            application/json:
              schema:
                type: object
                properties:
                  address:
                    type: string

  /api/wallet/evm/signMessage:
    post:
      tags: [Wallet]
      summary: Sign a message with the embedded EVM wallet
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
      responses:
        '200':
          description: Signature returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  signature:
                    type: string

  # ── Admin ─────────────────────────────────────────────────────────────────

  /api/admin/song/{id}/flag:
    patch:
      tags: [Admin]
      summary: Flag a song for review
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Song flagged
        '403':
          description: Forbidden — admin role required

  /api/admin/song/{id}/unflag:
    patch:
      tags: [Admin]
      summary: Remove flag from a song
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Flag removed

  /api/admin/search/rebuild:
    post:
      tags: [Admin]
      summary: Rebuild the full-text search index
      security:
        - BearerAuth: []
      responses:
        '202':
          description: Rebuild enqueued

  /api/admin/jobs:
    get:
      tags: [Admin]
      summary: List background jobs
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Job list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobStatus'

  /api/admin/jobs/{id}:
    get:
      tags: [Admin]
      summary: Get single job status
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '404':
          description: Job not found

  # ── Health ────────────────────────────────────────────────────────────────

  /health:
    get:
      tags: [Health]
      summary: Basic liveness check
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /health/db:
    get:
      tags: [Health]
      summary: Database connectivity and pool health
      responses:
        '200':
          description: Database healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  pool:
                    type: object
                    additionalProperties: true
        '503':
          description: Database unhealthy
