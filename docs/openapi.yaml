openapi: 3.0.3
info:
  title: AudioBlocks Backend API Reference
  version: 1.0.0
  description: API reference for AudioBlocks music NFT platform on Stellar/Soroban.
paths:
  /api/api-keys:
    post:
      summary: Create an API key
      description: Issues a new API key with explicit scopes (read-only, upload, admin).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                scopes:
                  type: array
                  items:
                    type: string
                    enum: [read-only, upload, admin]
      responses:
        '201':
          description: API key created successfully.
    get:
      summary: List API keys
      description: Returns the list of API keys for the authenticated user.
  /api/api-keys/{id}:
    delete:
      summary: Revoke an API key
      description: Revokes an active API key.

  /api/activity/onchain:
    get:
      summary: List indexed on-chain activity
      description: Queries indexed on-chain events from Soroban contracts with pagination and filtering by contractType, eventType, and address.
      parameters:
        - name: contractType
          in: query
          required: false
          description: Filter events by smart contract type (e.g. nft, artist, catalog, royalty, marketplace).
          schema:
            type: string
        - name: eventType
          in: query
          required: false
          description: Filter events by event name/type (e.g. mint, transfer, royalty_payout, sale, list, setup).
          schema:
            type: string
        - name: address
          in: query
          required: false
          description: Filter events by wallet or contract address (e.g. Stellar public key).
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: 1-based page number for pagination.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Number of items per page (maximum 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: A paginated list of indexed on-chain events.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/IndexedEvent'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
  /api/song/{id}/stats:
    get:
      summary: Get song statistics
      description: Returns aggregated playback and engagement metrics for a song. Public callers receive total plays and saves; the song artist or admins receive full metrics including unique listeners and revenue.
      parameters:
        - name: id
          in: path
          required: true
          description: Unique song identifier (UUID).
          schema:
            type: string
            format: uuid
        - name: window
          in: query
          required: false
          description: Aggregation time window. Default is 7d.
          schema:
            type: string
            enum: [24h, 7d, 30d, 90d, all-time]
            default: 7d
      responses:
        '200':
          description: Song statistics retrieved successfully.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Caching policy (public or private with 300s TTL).
            Vary:
              schema:
                type: string
              example: Authorization
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/SongStats'
        '400':
          description: Invalid window parameter.
        '404':
          description: Song not found.

  /api/song/artist/{artistId}/stats:
    get:
      summary: Get artist aggregated statistics via song route
      description: Returns catalog-wide metrics for the specified artist. Public callers receive plays and saves; the artist owner or admins receive full metrics including revenue and unique listeners.
      parameters:
        - name: artistId
          in: path
          required: true
          description: Unique artist identifier (UUID).
          schema:
            type: string
            format: uuid
        - name: window
          in: query
          required: false
          description: Aggregation time window. Default is 7d.
          schema:
            type: string
            enum: [24h, 7d, 30d, 90d, all-time]
            default: 7d
      responses:
        '200':
          description: Artist statistics retrieved successfully.
        '400':
          description: Invalid window parameter.
        '404':
          description: Artist not found.

  /api/artist/{id}/stats:
    get:
      summary: Get artist aggregated statistics
      description: Returns catalog-wide metrics for the specified artist. Public callers receive plays and saves; the artist owner or admins receive full metrics including revenue and unique listeners.
      parameters:
        - name: id
          in: path
          required: true
          description: Unique artist identifier (UUID).
          schema:
            type: string
            format: uuid
        - name: window
          in: query
          required: false
          description: Aggregation time window. Default is 7d.
          schema:
            type: string
            enum: [24h, 7d, 30d, 90d, all-time]
            default: 7d
      responses:
        '200':
          description: Artist statistics retrieved successfully.
        '400':
          description: Invalid window parameter.
        '404':
          description: Artist not found.

  /api/webhooks/{id}/deliveries:
    get:
      summary: List webhook delivery attempts
      description: Returns paginated delivery history for a webhook subscription (newest first). Only accessible by the subscription owner.
      parameters:
        - name: id
          in: path
          required: true
          description: Unique webhook subscription identifier (UUID).
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Delivery attempts list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookDelivery'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden - caller is not the subscription owner.
        '404':
          description: Webhook subscription not found.

  /api/webhooks/{id}/deliveries/{deliveryId}/redeliver:
    post:
      summary: Redeliver a webhook attempt
      description: Resends the event payload of a previous delivery attempt. Only accessible by the subscription owner.
      parameters:
        - name: id
          in: path
          required: true
          description: Webhook subscription UUID.
          schema:
            type: string
            format: uuid
        - name: deliveryId
          in: path
          required: true
          description: Webhook delivery attempt UUID.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Webhook redelivered successfully.
        '400':
          description: No payload stored for this delivery.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden - caller is not the subscription owner.
        '404':
          description: Subscription or delivery record not found.
        '502':
          description: Destination endpoint failed after retry attempts.
components:
  schemas:
    IndexedEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        contractType:
          type: string
          nullable: true
          example: marketplace
        contractId:
          type: string
          nullable: true
          example: CA...
        eventType:
          type: string
          example: sale
        address:
          type: string
          nullable: true
          example: GBXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
        txHash:
          type: string
          nullable: true
          example: a1b2c3d4e5f6...
        ledger:
          type: integer
          nullable: true
          example: 123456
        data:
          type: object
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SongStats:
      type: object
      properties:
        window:
          type: string
          example: 7d
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        totals:
          type: object
          properties:
            plays:
              type: integer
              example: 120
            saves:
              type: integer
              example: 30
            uniqueListeners:
              type: integer
              description: Owner and admin only.
              example: 45
            revenueStroops:
              type: string
              description: Owner and admin only.
              example: "5000000"
    WebhookDelivery:
      type: object
      properties:
        id:
          type: string
          format: uuid
        subscriptionId:
          type: string
          format: uuid
        eventId:
          type: string
        eventType:
          type: string
        attempt:
          type: integer
          example: 1
        status:
          type: string
          enum: [pending, succeeded, failed]
        responseStatus:
          type: integer
          nullable: true
          example: 200
        durationMs:
          type: integer
          nullable: true
          example: 45
        error:
          type: string
          nullable: true
        payload:
          type: object
          nullable: true
        createdAt:
          type: string
          format: date-time
    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 42
        totalPages:
          type: integer
          example: 3

