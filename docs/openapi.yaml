openapi: 3.0.3
info:
  title: AudioBlocks API Reference
  version: 1.0.0
  description: API reference for AudioBlocks including per-API-key scopes and permissions (read-only, upload, admin).
paths:
  /api/api-keys:
    post:
      summary: Create an API key with scopes/permissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                permissions:
                  type: array
                  items:
                    type: string
                scopes:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: API key successfully created
